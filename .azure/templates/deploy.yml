parameters:
  - name: artifactName
    type: string
    default: laravel-release
  - name: sshKeySecureFile
    type: string
  - name: deployStage
    type: string
    default: staging
  - name: deployerVersion
    type: string
    default: '8.0.5'

steps:
  # Deployment jobs auto-download every artifact; fetch only the one we need instead.
  - download: none

  - task: DownloadPipelineArtifact@2
    displayName: 'Download production artifact'
    inputs:
      buildType: current
      artifactName: ${{ parameters.artifactName }}
      targetPath: '$(Pipeline.Workspace)/artifact'

  - script: |
      set -e
      rm -rf "$(Pipeline.Workspace)/release"
      mkdir -p "$(Pipeline.Workspace)/release"
      tar -xzf "$(Pipeline.Workspace)/artifact/${{ parameters.artifactName }}.tar.gz" -C "$(Pipeline.Workspace)/release"
    displayName: 'Extract artifact'

  - task: InstallSSHKey@0
    displayName: 'Install deploy SSH key'
    inputs:
      knownHostsEntry: '$(SSH_KNOWN_HOSTS)'
      sshKeySecureFile: ${{ parameters.sshKeySecureFile }}

  - script: |
      set -e
      curl -fsSL -o "$(Agent.TempDirectory)/dep.phar" \
        "https://github.com/deployphp/deployer/releases/download/v${{ parameters.deployerVersion }}/deployer.phar"
      chmod +x "$(Agent.TempDirectory)/dep.phar"
      php "$(Agent.TempDirectory)/dep.phar" --version
    displayName: 'Install Deployer ${{ parameters.deployerVersion }}'

  - script: php "$(Agent.TempDirectory)/dep.phar" deploy stage=${{ parameters.deployStage }} --file=deploy.php -v --no-interaction
    displayName: 'Deploy release with Deployer'
    workingDirectory: '$(Pipeline.Workspace)/release'
    env:
      DEPLOY_STAGE: ${{ parameters.deployStage }}
      DEPLOY_HOSTNAME: $(DEPLOY_HOSTNAME)
      DEPLOY_SSH_USER: $(DEPLOY_SSH_USER)
      DEPLOY_PATH: $(DEPLOY_PATH)
