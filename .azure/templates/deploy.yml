parameters:
  - name: sshEndpoint
    type: string
  - name: deploymentRoot # no trailing slash
    type: string

steps:
  - task: DownloadPipelineArtifact@2
    inputs:
      buildType: 'current'
      artifactName: 'laravel-prod-tar'
      targetPath: '$(Build.ArtifactStagingDirectory)'

  - task: SSH@0
    displayName: 'Create Release Directory'
    inputs:
      sshEndpoint: ${{ parameters.sshEndpoint }}
      runOptions: 'commands'
      commands: |
        mkdir -p ${{ parameters.deploymentRoot }}/releases/$(Build.BuildId)

  - task: CopyFilesOverSSH@0
    displayName: 'Upload Artifact'
    inputs:
      sshEndpoint: ${{ parameters.sshEndpoint }}
      sourceFolder: '$(Build.ArtifactStagingDirectory)'
      contents: 'laravel-prod.tar.gz'
      targetFolder: 'public_html/releases/$(Build.BuildId)'
      overwrite: true

  - task: SSH@0
    inputs:
      sshEndpoint: ${{ parameters.sshEndpoint }}
      runOptions: 'commands' # Changed to 'commands' to avoid script upload
      commands: |

        # Clear any stale bootstrap cache before extracting
        rm -f ${{ parameters.deploymentRoot }}/bootstrap/cache/*.php
        cd ${{ parameters.deploymentRoot }} && tar -xzvf releases/$(Build.BuildId)/laravel-prod.tar.gz -C .
        cd ${{ parameters.deploymentRoot }} && php artisan migrate --force
        cd ${{ parameters.deploymentRoot }} && php artisan config:clear
        cd ${{ parameters.deploymentRoot }} && php artisan route:clear
        cd ${{ parameters.deploymentRoot }} && php artisan cache:clear
        cd ${{ parameters.deploymentRoot }} && php artisan config:cache
        rm -rf ${{ parameters.deploymentRoot }}/releases/
      readyTimeout: '20000'
