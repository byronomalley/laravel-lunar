parameters:
  - name: phpVersion
    type: string
  - name: nodeVersion
    type: string
  - name: composerCacheDir
    type: string
  - name: npmCacheDir
    type: string
  - name: artifactName
    type: string
    default: laravel-release

steps:
  - checkout: self
    displayName: 'Checkout source code'

  # -------------------------------
  # Toolchain
  # -------------------------------

  - script: |
      set -e
      sudo update-alternatives --set php /usr/bin/php${{ parameters.phpVersion }}
      sudo update-alternatives --set phar /usr/bin/phar${{ parameters.phpVersion }}
      sudo update-alternatives --set phpdbg /usr/bin/phpdbg${{ parameters.phpVersion }}
      sudo update-alternatives --set php-cgi /usr/bin/php-cgi${{ parameters.phpVersion }}
      sudo update-alternatives --set phar.phar /usr/bin/phar.phar${{ parameters.phpVersion }}
      php -v
    displayName: 'Use PHP ${{ parameters.phpVersion }}'

  - task: NodeTool@0
    displayName: 'Use Node ${{ parameters.nodeVersion }}'
    inputs:
      versionSpec: ${{ parameters.nodeVersion }}

  # -------------------------------
  # Dependency caches
  # -------------------------------

  - task: Cache@2
    displayName: 'Cache Composer downloads'
    inputs:
      key: 'composer | "$(Agent.OS)" | composer.lock'
      restoreKeys: |
        composer | "$(Agent.OS)"
      path: ${{ parameters.composerCacheDir }}

  - task: Cache@2
    displayName: 'Cache npm downloads'
    inputs:
      key: 'npm | "$(Agent.OS)" | package-lock.json'
      restoreKeys: |
        npm | "$(Agent.OS)"
      path: ${{ parameters.npmCacheDir }}

  # -------------------------------
  # Build with dev dependencies
  # -------------------------------

  - script: composer install --prefer-dist --no-progress --no-interaction
    displayName: 'Install Composer dependencies (dev)'
    workingDirectory: $(Build.SourcesDirectory)
    env:
      COMPOSER_CACHE_DIR: ${{ parameters.composerCacheDir }}

  - script: |
      set -e
      npm ci --cache "${{ parameters.npmCacheDir }}" --prefer-offline
      npm run build
    displayName: 'Install npm dependencies and build assets'
    workingDirectory: $(Build.SourcesDirectory)

  # -------------------------------
  # Test
  # -------------------------------

  - script: |
      set -e
      cp .env.example .env
      php artisan key:generate --no-interaction
      php artisan config:clear
    displayName: 'Prepare test environment'
    workingDirectory: $(Build.SourcesDirectory)

  - script: |
      mariadb -h "$(CI_DB_HOST)" -u root -p"$CI_DB_PASSWORD" \
        -e "DROP DATABASE IF EXISTS testing; CREATE DATABASE testing;"
    displayName: 'Create CI database'
    env:
      CI_DB_PASSWORD: $(CI_DB_PASSWORD)

  - script: php artisan test --compact
    displayName: 'Run tests'
    workingDirectory: $(Build.SourcesDirectory)
    env:
      DB_CONNECTION: mariadb
      DB_HOST: $(CI_DB_HOST)
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: $(CI_DB_PASSWORD)

  - script: |
      mariadb -h "$(CI_DB_HOST)" -u root -p"$CI_DB_PASSWORD" -e "DROP DATABASE IF EXISTS testing;"
    displayName: 'Drop CI database'
    condition: always()
    env:
      CI_DB_PASSWORD: $(CI_DB_PASSWORD)

  # -------------------------------
  # Optimise for production
  # -------------------------------

  - script: composer install --no-dev --prefer-dist --no-progress --no-interaction --optimize-autoloader --classmap-authoritative
    displayName: 'Prune to production Composer dependencies'
    workingDirectory: $(Build.SourcesDirectory)
    env:
      COMPOSER_CACHE_DIR: ${{ parameters.composerCacheDir }}

  - script: |
      set -e
      rm -f .env
      rm -f bootstrap/cache/*.php
    displayName: 'Remove test environment and framework caches'
    workingDirectory: $(Build.SourcesDirectory)

  # -------------------------------
  # Package the production artifact
  # -------------------------------

  - task: CopyFiles@2
    displayName: 'Stage production files'
    inputs:
      SourceFolder: '$(Build.SourcesDirectory)'
      Contents: |
        **
        !node_modules/**
        !.git/**
        !.github/**
        !.azure/**
        !.ai/**
        !.agents/**
        !.claude/**
        !.junie/**
        !.kiro/**
        !.idea/**
        !storage/**
        !tests/**
        !documentation/**
        !docker/**
        !compose*.yml
        !phpunit.xml
        !.env*
        !.mcp.json
        !.editorconfig
        !.gitignore
        !.gitattributes
        !AGENTS.md
        !CLAUDE.md
        !README.md
        !boost.json
        !opencode.json
        !database/database.sqlite
      TargetFolder: '$(Build.ArtifactStagingDirectory)/app'

  - task: ArchiveFiles@2
    displayName: 'Archive production files'
    inputs:
      rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/app'
      includeRootFolder: false
      archiveType: tar
      tarCompression: gz
      archiveFile: '$(Build.ArtifactStagingDirectory)/${{ parameters.artifactName }}.tar.gz'
      replaceExistingArchive: true

  - task: PublishPipelineArtifact@1
    displayName: 'Publish production artifact'
    inputs:
      targetPath: '$(Build.ArtifactStagingDirectory)/${{ parameters.artifactName }}.tar.gz'
      artifact: ${{ parameters.artifactName }}
      publishLocation: pipeline
