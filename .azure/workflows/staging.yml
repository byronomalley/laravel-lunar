trigger:
  branches:
    include:
      - develop

pr: none

pool:
  name: Default

variables:
  - group: laravel-lunar-staging
  - name: PHP_VERSION
    value: '8.5'
  - name: NODE_VERSION
    value: '22.x'
  - name: COMPOSER_CACHE_DIR
    value: $(Pipeline.Workspace)/.composer/cache
  - name: NPM_CACHE_DIR
    value: $(Pipeline.Workspace)/.npm
  - name: COMPOSER_NO_INTERACTION
    value: 1
  - name: ARTIFACT_NAME
    value: laravel-release

stages:
  - stage: build
    displayName: 'Build, test and package'
    jobs:
      - job: build
        displayName: 'Build, test and package'
        steps:
          - template: ../templates/build.yml
            parameters:
              phpVersion: $(PHP_VERSION)
              nodeVersion: $(NODE_VERSION)
              composerCacheDir: $(COMPOSER_CACHE_DIR)
              npmCacheDir: $(NPM_CACHE_DIR)
              artifactName: $(ARTIFACT_NAME)

  - stage: deploy
    displayName: 'Deploy to staging'
    dependsOn: build
    condition: succeeded()
    jobs:
      - deployment: deploy
        displayName: 'Atomic deploy with Deployer'
        environment: staging
        strategy:
          runOnce:
            deploy:
              steps:
                - template: ../templates/deploy.yml
                  parameters:
                    artifactName: $(ARTIFACT_NAME)
                    sshKeySecureFile: staging_deploy_key
                    deployStage: staging
