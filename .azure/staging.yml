trigger:
  - feature/cicd

pool:
  name: Default

variables:
  PHP_VERSION: '8.5'
  NODE_VERSION: '18.x'
  NPM_CACHE_DIR: $(Pipeline.Workspace)/.npm
  COMPOSER_CACHE_DIR: $(Pipeline.Workspace)/.composer/cache
  COMPOSER_NO_INTERACTION: 1

stages:
  - stage: build_test_stage
    displayName: 'Build Dependencies and Run Tests'
    jobs:
      - job: build_test_job
        displayName: 'Build Dependencies and Run Tests'
        steps:
          - checkout: self
            displayName: 'Checkout source code'

          # FIXED: Syntax correction for self-hosted agent PHP variable usage
          - script: |
              sudo update-alternatives --set php /usr/bin/php$(PHP_VERSION)
              sudo update-alternatives --set phar /usr/bin/phar$(PHP_VERSION)
              sudo update-alternatives --set phpdbg /usr/bin/phpdbg$(PHP_VERSION)
              sudo update-alternatives --set php-cgi /usr/bin/php-cgi$(PHP_VERSION)
              sudo update-alternatives --set phar.phar /usr/bin/phar.phar$(PHP_VERSION)
              php -version
            displayName: 'Set Host PHP Version'

          - script: php -v
            displayName: 'Check PHP version'

#          - script: |
#              composer config --global http-basic.dev.azure.com "fake@fake.com" XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
#            displayName: 'Apply Access Token to Composer'
#            workingDirectory: $(Build.SourcesDirectory)

          - script: |
              echo "Installing Composer Dev Dependencies with secure authentication..."
              composer install --no-interaction --prefer-dist --no-progress
            displayName: 'Install Composer Dev Dependencies'
            workingDirectory: $(Build.SourcesDirectory)
            env:
              # Composer reads this variable automatically to authenticate
              COMPOSER_AUTH: '{"http-basic": {"dev.azure.com": {"username": "$(MELETT_AZURE_ORGANISATION_PAT_USER)", "password": "$(MELETT_AZURE_ORGANISATION_PAT)"}}}'

          - script: |
              npm ci
              npm run build
            displayName: 'Install Node Dependencies and Build Assets'
            workingDirectory: $(Build.SourcesDirectory)

          - script: |
              cp .env.example .env
              sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=testing/' .env
              sed -i "s/^DB_DATABASE=.*/DB_DATABASE=testing/" .env
              sed -i "s/^DB_USERNAME=.*/DB_USERNAME=root/" .env
              sed -i "s/^DB_PASSWORD=.*/DB_PASSWORD=password/" .env
              php artisan key:generate
            displayName: 'Set Up Environment'
            workingDirectory: $(Build.SourcesDirectory)

          - script: |
              php artisan config:clear
              php artisan route:clear
              php artisan cache:clear
              php artisan config:cache
            displayName: 'Optimize Laravel Config'
            workingDirectory: $(Build.SourcesDirectory)

          - script: |
              echo "Creating temporary database for this pipeline..."
              mysql -h mysql -u root -p"password" -e "DROP DATABASE IF EXISTS testing;"
              mysql -h mysql -u root -p"password" -e "CREATE DATABASE IF NOT EXISTS testing;"
            displayName: 'Create CI database'
            workingDirectory: $(Build.SourcesDirectory)

          - script: |
              php artisan migrate --force
              php artisan db:seed
            displayName: 'Run Database Seeders & Migrations'
            workingDirectory: $(Build.SourcesDirectory)

          - script: |
              php artisan test
            displayName: 'Run Tests'
            workingDirectory: $(Build.SourcesDirectory)

          - script: |
              echo "Removing dev dependencies for production artifact..."
              composer install --no-dev --optimize-autoloader --classmap-authoritative
            displayName: 'Prune Composer Dev Dependencies'
            workingDirectory: $(Build.SourcesDirectory)

          - script: |
              echo "Removing node_modules to shrink artifact..."
              rm -rf $(Build.SourcesDirectory)/node_modules
            displayName: 'Remove Node Modules'

          # FIXED: Explicitly wipe the testing configs so they never reach production target
          - script: |
              rm -f $(Build.SourcesDirectory)/.env
              php artisan config:clear
            displayName: 'Wipe Testing Configuration Files'
            workingDirectory: $(Build.SourcesDirectory)

          - script: |
              echo "Deleting temporary database for this pipeline..."
              mysql -h mysql -u root -p"password" -e "DROP DATABASE IF EXISTS testing;"
            displayName: 'Delete CI database'
            workingDirectory: $(Build.SourcesDirectory)
#            condition: always()

          # -------------------------------
          # Package the production artifact
          # -------------------------------

          - task: CopyFiles@2
            displayName: "Copy files to the artefact staging directory"
            inputs:
              SourceFolder: "$(Build.SourcesDirectory)"
              Contents: |
                **/*
                !node_modules/**
                !.git/**
                !storage/**
                !documentation/**
                !docker/**
                !azure-pipelines.yml
                !documentation.html
                !CHANGELOG.md
                !README.md
                !.env.testing
                !.env.example
                !.env.local
                !.env
              TargetFolder: "$(Build.ArtifactStagingDirectory)/tmp"

          - task: ArchiveFiles@2
            inputs:
              rootFolderOrFile: "$(Build.ArtifactStagingDirectory)/tmp"
              includeRootFolder: false
              archiveType: 'tar'
              tarCompression: 'gz' # Creates a .tar.gz file
              archiveFile: '$(Build.ArtifactStagingDirectory)/release-artifact.tar.gz'
              replaceExistingArchive: true

          - script: |
              echo "Streaming built workspace to remote server via Deployer..."
              vendor/bin/dep deploy staging -v
            displayName: 'Execute Laravel Deployer Upload'
            env:
              SERVER_IP: $(STAGING_SERVER_IP)
              SSH_USER: $(STAGING_SSH_USER)
              DEPLOYMENT_PATH: $(STAGING_DEPLOYMENT_PATH)
              RELEASE_ARTIFACT: '$(Build.ArtifactStagingDirectory)/release-artifact.tar.gz'
